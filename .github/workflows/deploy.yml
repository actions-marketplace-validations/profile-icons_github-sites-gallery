name: deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Config
        uses: actions/configure-pages@v6

      - name: Build
        id: gallery
        uses: $/.github/actions/build-gallery
        with:
          gh_usernames: ${{ secrets.GH_USERNAMES }}
          gh_pat: ${{ secrets.GH_PAT }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ steps.gallery.outputs.build-path }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
